name: OpenAPI Schema

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  check-openapi:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      # The pull_request checkout is the merge commit, so HEAD^1 is the tip
      # of main and depth 2 is enough to see what this PR changes.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Check whether this PR changes the schema
        id: changed
        run: |
          if git diff --quiet HEAD^1 HEAD -- api-reference/openapi.json; then
            echo "schema=false" >> "$GITHUB_OUTPUT"
          else
            echo "schema=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate committed OpenAPI schema
        run: npm run check:openapi

      # A PR that leaves the schema alone must not fail because the live API
      # moved on; the update-openapi job opens a PR for that.
      - name: Pull latest OpenAPI schema
        id: pull
        continue-on-error: ${{ steps.changed.outputs.schema != 'true' }}
        run: npm run update:openapi

      - name: Ensure committed schema is current
        if: steps.pull.outcome == 'success'
        env:
          SCHEMA_CHANGED: ${{ steps.changed.outputs.schema }}
        run: |
          if git diff --quiet -- api-reference/openapi.json; then
            echo "api-reference/openapi.json matches the live API schema."
            exit 0
          fi
          git --no-pager diff --stat -- api-reference/openapi.json
          if [ "$SCHEMA_CHANGED" = "true" ]; then
            echo "::error file=api-reference/openapi.json::This PR changes api-reference/openapi.json, but the file differs from https://api.fish.audio/openapi.json. Run 'npm run update:openapi' and commit the result, or wait until the API change is live."
            git --no-pager diff -- api-reference/openapi.json | head -n 200
            exit 1
          fi
          echo "::warning file=api-reference/openapi.json::main is behind https://api.fish.audio/openapi.json. This PR does not change the schema, so it is not blocked; the 'chore: update OpenAPI schema' PR brings main up to date."

      - name: Report that the live schema could not be fetched
        if: steps.pull.outcome == 'failure'
        run: echo "::warning::Could not fetch https://api.fish.audio/openapi.json, so the staleness check was skipped. This PR does not change the schema."

  update-openapi:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Pull latest OpenAPI schema
        run: npm run update:openapi

      - name: Validate OpenAPI schema
        run: npm run check:openapi

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore: update OpenAPI schema"
          title: "chore: update OpenAPI schema"
          body: "Auto-generated update from https://api.fish.audio/openapi.json"
          branch: chore/update-openapi-schema
          delete-branch: true
          token: ${{ secrets.BOT_TOKEN }}
          author: ${{ vars.BOT_NAME }} <${{ vars.BOT_EMAIL }}>
          committer: ${{ vars.BOT_NAME }} <${{ vars.BOT_EMAIL }}>
