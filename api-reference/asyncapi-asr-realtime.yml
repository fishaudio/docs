asyncapi: 3.0.0

info:
  title: Fish Audio Realtime Speech-to-Text WebSocket API
  version: 1.0.0
  description: |
    Realtime speech-to-text streaming via WebSocket using MessagePack serialization.

    ## Protocol Overview

    The realtime speech-to-text endpoint streams audio in and transcripts out:

    1. **Client** connects to `/v1/asr/realtime` with auth headers
    2. **Client** sends `config`, and the **Server** answers with `session_started`
    3. **Client** streams `audio` messages
    4. **Server** sends turn events (`speech_start`, `user_turn_taken`, `eager_end_of_turn`) and a `committed` transcript per turn
    5. **Client** sends `audio_done`; the **Server** sends `session_done` and closes the connection

    ## Message Serialization

    All messages are serialized using **MessagePack** (binary format) before sending over the WebSocket.

    ## Common Use Cases

    - Voice agents that listen and respond in real time
    - Live captions
    - Voice commands
    - Phone calls

servers:
  production:
    host: api.fish.audio
    protocol: wss
    description: Fish Audio production WebSocket server
    security:
      - $ref: "#/components/securitySchemes/bearerAuth"

channels:
  asrRealtime:
    address: /v1/asr/realtime
    messages:
      config:
        $ref: "#/components/messages/AsrConfig"
      audio:
        $ref: "#/components/messages/AsrAudio"
      finalize:
        $ref: "#/components/messages/AsrFinalize"
      configure:
        $ref: "#/components/messages/AsrConfigure"
      contextAdd:
        $ref: "#/components/messages/AsrContextAdd"
      keepalive:
        $ref: "#/components/messages/AsrKeepalive"
      audioDone:
        $ref: "#/components/messages/AsrAudioDone"
      agentSpeaking:
        $ref: "#/components/messages/AsrAgentSpeaking"
      sessionStarted:
        $ref: "#/components/messages/AsrSessionStarted"
      speechStart:
        $ref: "#/components/messages/AsrSpeechStart"
      userTurnTaken:
        $ref: "#/components/messages/AsrUserTurnTaken"
      draft:
        $ref: "#/components/messages/AsrDraft"
      eagerEndOfTurn:
        $ref: "#/components/messages/AsrEagerEndOfTurn"
      turnResumed:
        $ref: "#/components/messages/AsrTurnResumed"
      userBackchannel:
        $ref: "#/components/messages/AsrUserBackchannel"
      committed:
        $ref: "#/components/messages/AsrCommitted"
      vad:
        $ref: "#/components/messages/AsrVad"
      eotProb:
        $ref: "#/components/messages/AsrEotProb"
      configured:
        $ref: "#/components/messages/AsrConfigured"
      progress:
        $ref: "#/components/messages/AsrProgress"
      error:
        $ref: "#/components/messages/AsrError"
      sessionDone:
        $ref: "#/components/messages/AsrSessionDone"
    bindings:
      ws:
        headers:
          type: object
          properties:
            model:
              type: string
              enum:
                - transcribe-stream-1
              default: transcribe-stream-1
              description: Realtime speech-to-text model. Optional; `transcribe-stream-1` (Preview) is the default and the only realtime model. The legacy name `transcribe-1-pro-realtime` reaches the same model.
    description: |
      Realtime speech-to-text channel. Clients stream audio and receive
      transcripts turn by turn, with turn detection, optional live drafts and
      conversation context.

      ## Connection Headers
      - `Authorization: Bearer <api_key>` - Required for authentication (see security section)
      - `model: transcribe-stream-1` (Preview) - Optional; the default

      Every message in both directions is one MessagePack map in a binary
      frame, with a `type` field. Send `config` first, wait for
      `session_started`, then stream `audio`. Ignore fields and message types
      you do not know in server messages: version 1 only adds them.

operations:
  receiveAsrClientMessages:
    action: receive
    channel:
      $ref: "#/channels/asrRealtime"
    messages:
      - $ref: "#/channels/asrRealtime/messages/config"
      - $ref: "#/channels/asrRealtime/messages/audio"
      - $ref: "#/channels/asrRealtime/messages/finalize"
      - $ref: "#/channels/asrRealtime/messages/configure"
      - $ref: "#/channels/asrRealtime/messages/contextAdd"
      - $ref: "#/channels/asrRealtime/messages/keepalive"
      - $ref: "#/channels/asrRealtime/messages/audioDone"
      - $ref: "#/channels/asrRealtime/messages/agentSpeaking"
    description: |
      Server receives configuration, audio and control messages from the client.

      **Message Sequence:**
      1. Client sends `config` once, as the first message, within 10 seconds of connecting
      2. Client streams `audio` after `session_started`, 80–100 ms per message
      3. Client can send `finalize`, `configure`, `context_add`, `keepalive` and `agent_speaking` at any time
      4. Client sends `audio_done` when there is no more audio

  sendAsrServerMessages:
    action: send
    channel:
      $ref: "#/channels/asrRealtime"
    messages:
      - $ref: "#/channels/asrRealtime/messages/sessionStarted"
      - $ref: "#/channels/asrRealtime/messages/speechStart"
      - $ref: "#/channels/asrRealtime/messages/userTurnTaken"
      - $ref: "#/channels/asrRealtime/messages/draft"
      - $ref: "#/channels/asrRealtime/messages/eagerEndOfTurn"
      - $ref: "#/channels/asrRealtime/messages/turnResumed"
      - $ref: "#/channels/asrRealtime/messages/userBackchannel"
      - $ref: "#/channels/asrRealtime/messages/committed"
      - $ref: "#/channels/asrRealtime/messages/vad"
      - $ref: "#/channels/asrRealtime/messages/eotProb"
      - $ref: "#/channels/asrRealtime/messages/configured"
      - $ref: "#/channels/asrRealtime/messages/progress"
      - $ref: "#/channels/asrRealtime/messages/error"
      - $ref: "#/channels/asrRealtime/messages/sessionDone"
    description: |
      Server sends session, turn and transcript messages to the client.

      **Event Flow:**
      - Server sends `session_started` once, after a valid `config`
      - For each turn: `speech_start`, then optional `draft` messages, `user_turn_taken` (auto mode), optional `eager_end_of_turn` / `turn_resumed`, and exactly one `committed`
      - Server sends `user_backchannel` in auto mode while the client reports `agent_speaking: true`
      - Server sends `session_done` after `audio_done`, then closes with 1000
      - Clients should ignore unknown messages and fields to support future protocol extensions

components:
  messages:
    AsrConfig:
      name: config
      title: Configure the Session
      contentType: application/msgpack
      payload:
        type: object
        required:
          - type
          - audio
        properties:
          type:
            type: string
            const: config
            description: Message type identifier
          protocol_version:
            type: integer
            const: 1
            default: 1
            description: Optional. Only `1` is valid.
          audio:
            $ref: "#/components/schemas/AsrAudioFormat"
          turn_detection:
            $ref: "#/components/schemas/AsrTurnDetection"
          results:
            $ref: "#/components/schemas/AsrResults"
          context:
            $ref: "#/components/schemas/AsrContext"
          client_reference_id:
            type: string
            maxLength: 256
            description: Your own ID for the session. Recorded with the session; not sent back.
      description: |
        The first message on the connection. Send it within 10 seconds of
        connecting, then wait for `session_started` before sending audio.
        An invalid `config`, including one with an unknown field, is
        answered with an `error` (`invalid_config` or `unsupported_audio`)
        and close code 4400. A first message that is not a readable
        `config` (for example a text frame or JSON) gets `invalid_config`
        and close code 4400 too. Send only the documented fields: not
        every other field is refused, so check `session_started.config`,
        which shows the settings in effect.
      examples:
        - name: Voice agent
          payload:
            type: config
            audio:
              format: pcm_s16le
              sample_rate: 16000
              channels: 1
            turn_detection:
              mode: auto
              eager: true
            context:
              terms:
                - Fish Audio
        - name: Live captions
          payload:
            type: config
            audio:
              format: pcm_s16le
              sample_rate: 48000
              channels: 1
            results:
              drafts: true
              diarize: false

    AsrAudio:
      name: audio
      title: Send Audio
      contentType: application/msgpack
      payload:
        type: object
        required:
          - type
          - data
        properties:
          type:
            type: string
            const: audio
            description: Message type identifier
          data:
            type: string
            format: binary
            description: |
              The raw PCM bytes in the configured format, as MessagePack
              `bin`. Do not base64-encode the audio, and do not send it as a
              string or an array of numbers. If you do, you receive a
              recoverable `invalid_request`, and those messages are dropped:
              nothing in them is transcribed or counted as received audio.
              Any length; an odd trailing byte waits for the next message.
      description: |
        Audio in the format from `config`. Send it after `session_started`;
        80–100 ms per message is a good size. A message can be at most 1 MiB.
      examples:
        - payload:
            type: audio
            data: <binary PCM audio>

    AsrFinalize:
      name: finalize
      title: Commit the Current Turn
      contentType: application/msgpack
      payload:
        type: object
        required:
          - type
        properties:
          type:
            type: string
            const: finalize
            description: Message type identifier
      description: |
        Commits the current turn now, with `reason: "finalize"`. Ignored when
        no turn is open. In auto mode the turn it ends is always a user turn.
        Use it for push-to-talk (manual mode) when the button is released.
      examples:
        - payload:
            type: finalize

    AsrConfigure:
      name: configure
      title: Change Settings
      contentType: application/msgpack
      payload:
        type: object
        required:
          - type
        properties:
          type:
            type: string
            const: configure
            description: Message type identifier
          turn_detection:
            $ref: "#/components/schemas/AsrTurnDetectionUpdate"
          results:
            $ref: "#/components/schemas/AsrResultsUpdate"
          context:
            type: object
            properties:
              terms:
                type: array
                maxItems: 100
                items:
                  type: string
                  maxLength: 32
                description: Replaces the list of terms.
            description: |
              Only `terms` is accepted here. A `configure` with `history`
              gets `configured` with `ok: false`; send earlier lines with
              `context_add`.
      description: |
        Changes settings during the session. Answered by `configured`. Every
        field is optional, and a field you leave out keeps its current value.
        The one exception: switching `mode` without `silence_timeout_ms`
        resets it to the new mode's default. If any value is invalid,
        nothing in the message is applied. `audio` is fixed for the
        session: a `configure` with an unknown field, with an `audio` that
        differs from the session's, or with `context.history` gets
        `configured` with `ok: false`, and nothing in it is applied. An
        `audio` identical to the session's is accepted. As with `config`,
        send only the documented fields; `configured.config` shows the
        settings in effect. When `mode` changes to or from `auto`,
        `configured` can take a few seconds.
      examples:
        - payload:
            type: configure
            turn_detection:
              mode: vad
              silence_timeout_ms: 900
        - payload:
            type: configure
            context:
              terms:
                - Fish Audio
                - Main Street

    AsrContextAdd:
      name: context_add
      title: Add Conversation Context
      contentType: application/msgpack
      payload:
        type: object
        required:
          - type
          - items
        properties:
          type:
            type: string
            const: context_add
            description: Message type identifier
          items:
            type: array
            maxItems: 32
            items:
              $ref: "#/components/schemas/AsrContextItem"
            description: Conversation items, oldest first. Send each line your agent speaks as an `assistant` item.
          reset_history:
            type: boolean
            default: false
            description: First drop the items you added before.
      description: |
        Adds conversation context. Committed user turns are added
        automatically; send what the other party (your agent) said, ideally
        right after the `committed` it answers. No reply.
      examples:
        - payload:
            type: context_add
            items:
              - role: assistant
                text: Sure. Which day works for you?

    AsrKeepalive:
      name: keepalive
      title: Keep the Session Open
      contentType: application/msgpack
      payload:
        type: object
        required:
          - type
        properties:
          type:
            type: string
            const: keepalive
            description: Message type identifier
      description: |
        Keeps an idle session open. A session closes after 30 seconds without
        any client message. A WebSocket ping counts as client activity too,
        so a client library that sends pings on its own keeps the session
        open.
      examples:
        - payload:
            type: keepalive

    AsrAudioDone:
      name: audio_done
      title: End of Audio
      contentType: application/msgpack
      payload:
        type: object
        required:
          - type
        properties:
          type:
            type: string
            const: audio_done
            description: Message type identifier
      description: |
        No more audio. The server commits the open turn
        (`reason: "audio_done"`), sends `session_done`, and closes with 1000.
      examples:
        - payload:
            type: audio_done

    AsrAgentSpeaking:
      name: agent_speaking
      title: Agent Speaking State
      contentType: application/msgpack
      payload:
        type: object
        required:
          - type
          - speaking
        properties:
          type:
            type: string
            const: agent_speaking
            description: Message type identifier
          speaking:
            type: boolean
            description: |
              `true` when you commit to playing a reply (typically on
              `committed`); `false` when its last sample has played or you
              stop it. Default: not speaking.
      description: |
        For voice agents in auto mode. While the agent is speaking, a short
        acknowledgement from the user produces `user_backchannel` instead of
        `user_turn_taken`. Applies at its position in the audio stream; send
        it on the same connection as your audio, only when the value changes.
        No effect in vad and manual mode.
      examples:
        - payload:
            type: agent_speaking
            speaking: true

    AsrSessionStarted:
      name: session_started
      title: Session Started
      contentType: application/msgpack
      payload:
        type: object
        required:
          - type
          - seq
          - session_id
          - request_id
          - config
          - limits
        properties:
          type:
            type: string
            const: session_started
            description: Message type identifier
          seq:
            type: integer
            description: Message sequence number, increasing by one per server message.
          session_id:
            type: string
            description: The session's ID.
          request_id:
            type: string
            description: Same as the `x-request-id` response header. Include it when you contact support.
          config:
            type: object
            description: The effective configuration, with defaults filled in.
          limits:
            $ref: "#/components/schemas/AsrLimits"
      description: |
        The session is ready. Send audio after this message.
      examples:
        - payload:
            type: session_started
            seq: 0
            session_id: s_ab12cd34
            request_id: 0b6f4c1e-7d2a-4e8b-9f3c-5a1d2e3f4b6c
            config:
              protocol_version: 1
              model: transcribe-stream-1
              audio:
                format: pcm_s16le
                sample_rate: 16000
                channels: 1
              turn_detection:
                mode: auto
                eager: true
                silence_timeout_ms: 5000
              results:
                drafts: true
                ignore_timestamps: true
                diarize: true
                vad_events: false
                eot_events: false
            limits:
              max_session_ms: 3600000
              max_turn_ms: 60000
              max_frame_bytes: 1048576

    AsrSpeechStart:
      name: speech_start
      title: Turn Opened
      contentType: application/msgpack
      payload:
        type: object
        required:
          - type
          - seq
          - turn_index
          - audio_ms
        properties:
          type:
            type: string
            const: speech_start
            description: Message type identifier
          seq:
            type: integer
          turn_index:
            type: integer
            description: The turn that opened, counting from 0.
          audio_ms:
            type: integer
            description: Where the turn starts, slightly before the speech.
      description: |
        A turn opened on voice activity. In auto mode, noise and other voices
        open turns too: wait for `user_turn_taken` before treating it as the
        user's turn.
      examples:
        - payload:
            type: speech_start
            seq: 1
            turn_index: 0
            audio_ms: 300

    AsrUserTurnTaken:
      name: user_turn_taken
      title: User Took the Turn
      contentType: application/msgpack
      payload:
        type: object
        required:
          - type
          - seq
          - turn_index
          - audio_ms
        properties:
          type:
            type: string
            const: user_turn_taken
            description: Message type identifier
          seq:
            type: integer
          turn_index:
            type: integer
          audio_ms:
            type: integer
            description: Where the server judged that the user took the turn.
      description: |
        Auto mode only: the server judged that the user is taking their turn.
        At most once per turn, before any `eager_end_of_turn`. For a voice
        agent that is speaking, this is the signal to stop (barge-in).
      examples:
        - payload:
            type: user_turn_taken
            seq: 3
            turn_index: 0
            audio_ms: 1280

    AsrDraft:
      name: draft
      title: Draft Transcript
      contentType: application/msgpack
      payload:
        type: object
        required:
          - type
          - seq
          - turn_index
          - text
          - settled_text
          - audio_ms
        properties:
          type:
            type: string
            const: draft
            description: Message type identifier
          seq:
            type: integer
          turn_index:
            type: integer
          text:
            type: string
            description: The whole turn so far. Replaces the previous draft. Not final.
          settled_text:
            type: string
            description: |
              The beginning of `text` that the server is confident will not
              change; `text` always starts with it. Often empty, especially
              early in a turn and in short turns. Within a turn it normally
              only grows, but the server can occasionally revise it, so render
              from the latest draft.
          language:
            type: string
            description: Optional. English name of the detected language.
          language_code:
            type: string
            description: Optional. ISO 639-1 code of the detected language.
          audio_ms:
            type: integer
            description: The audio position the draft covers up to.
          audio_received_ms:
            type: integer
          audio_processed_ms:
            type: integer
          audio_committed_ms:
            type: integer
      description: |
        Live draft of the open turn, with `results.drafts: true`. Best effort.
        For live captions, show `settled_text` as stable and the rest of
        `text` as tentative; take the final text from `committed`.
      examples:
        - payload:
            type: draft
            seq: 4
            turn_index: 0
            text: what's the weather like
            settled_text: ""
            language: English
            language_code: en
            audio_ms: 1800
            audio_received_ms: 1900
            audio_processed_ms: 1800
            audio_committed_ms: 0

    AsrEagerEndOfTurn:
      name: eager_end_of_turn
      title: Eager End of Turn
      contentType: application/msgpack
      payload:
        type: object
        required:
          - type
          - seq
          - turn_index
          - text
        properties:
          type:
            type: string
            const: eager_end_of_turn
            description: Message type identifier
          seq:
            type: integer
          turn_index:
            type: integer
          text:
            type: string
            description: Exactly what `committed` will say unless `turn_resumed` follows. Can be empty.
          language:
            type: string
          language_code:
            type: string
          audio_ms:
            type: integer
            description: Optional. The audio position of the signal.
      description: |
        With `turn_detection.eager: true` in auto mode, after
        `user_turn_taken`: the turn has probably ended. Start preparing your
        response; `turn_resumed` cancels it. Not every turn has one.
      examples:
        - payload:
            type: eager_end_of_turn
            seq: 5
            turn_index: 0
            text: What's the weather like?
            language: English
            language_code: en
            audio_ms: 2240

    AsrTurnResumed:
      name: turn_resumed
      title: Turn Resumed
      contentType: application/msgpack
      payload:
        type: object
        required:
          - type
          - seq
          - turn_index
        properties:
          type:
            type: string
            const: turn_resumed
            description: Message type identifier
          seq:
            type: integer
          turn_index:
            type: integer
      description: |
        The speaker went on after `eager_end_of_turn`: discard that text. If
        you already started playing a reply, stop it and send
        `agent_speaking: false`.
      examples:
        - payload:
            type: turn_resumed
            seq: 6
            turn_index: 0

    AsrUserBackchannel:
      name: user_backchannel
      title: User Backchannel
      contentType: application/msgpack
      payload:
        type: object
        required:
          - type
          - seq
          - turn_index
          - audio_ms
        properties:
          type:
            type: string
            const: user_backchannel
            description: Message type identifier
          seq:
            type: integer
          turn_index:
            type: integer
            description: The open turn, or the index the next turn will get when no turn is open.
          audio_ms:
            type: integer
            description: Where the acknowledgement is in the audio.
      description: |
        Auto mode only, while your agent is speaking: the user acknowledged
        ("mm-hm", "yeah") without taking the turn. Keep talking.
      examples:
        - payload:
            type: user_backchannel
            seq: 8
            turn_index: 1
            audio_ms: 3840

    AsrCommitted:
      name: committed
      title: Committed Turn
      contentType: application/msgpack
      payload:
        type: object
        required:
          - type
          - seq
          - turn_index
          - text
          - audio_start_ms
          - audio_end_ms
          - reason
          - degraded
          - user_turn
          - turn_kind
        properties:
          type:
            type: string
            const: committed
            description: Message type identifier
          seq:
            type: integer
          turn_index:
            type: integer
          text:
            type: string
            description: The final transcript of the turn. Can contain speaker tags such as `<|speaker:0|>` and sound tags such as `[laughter]`. Can be empty.
          words:
            type: array
            items:
              $ref: "#/components/schemas/AsrWord"
            description: Present when `results.ignore_timestamps` is `false` and the commit is not degraded.
          language:
            type: string
          language_code:
            type: string
          audio_start_ms:
            type: integer
          audio_end_ms:
            type: integer
          reason:
            type: string
            enum:
              - eot
              - finalize
              - silence_timeout
              - max_turn_duration
              - audio_done
            description: Why the turn ended. Treat an unknown value like `eot`.
          degraded:
            type: boolean
            description: "`true` when the final pass failed and the text comes from the last draft."
          user_turn:
            type: boolean
            description: "`true` for the user's turn. Decide whether to answer by this field. Treat a missing value as `true`."
          turn_kind:
            type: string
            enum:
              - user
              - backchannel
              - other
            description: "`user` exactly when `user_turn` is true. Treat an unknown value like `other` when `user_turn` is false."
          audio_received_ms:
            type: integer
          audio_processed_ms:
            type: integer
          audio_committed_ms:
            type: integer
      description: |
        The final transcript of a turn. Every turn has exactly one, and nothing
        about the turn follows it.
      examples:
        - payload:
            type: committed
            seq: 6
            turn_index: 0
            text: What's the weather like?
            language: English
            language_code: en
            audio_start_ms: 300
            audio_end_ms: 2880
            reason: eot
            degraded: false
            user_turn: true
            turn_kind: user
            audio_received_ms: 3000
            audio_processed_ms: 2900
            audio_committed_ms: 2880

    AsrVad:
      name: vad
      title: Voice Activity
      contentType: application/msgpack
      payload:
        type: object
        required:
          - type
          - seq
          - audio_ms
          - score
        properties:
          type:
            type: string
            const: vad
            description: Message type identifier
          seq:
            type: integer
          audio_ms:
            type: integer
          score:
            type: number
            minimum: 0
            maximum: 1
            description: Voice activity.
      description: |
        Voice activity, up to 10 per second, with `results.vad_events: true`.
      examples:
        - payload:
            type: vad
            seq: 12
            audio_ms: 1100
            score: 0.93

    AsrEotProb:
      name: eot_prob
      title: End-of-Turn Likelihood
      contentType: application/msgpack
      payload:
        type: object
        required:
          - type
          - seq
          - turn_index
          - audio_ms
          - prob
        properties:
          type:
            type: string
            const: eot_prob
            description: Message type identifier
          seq:
            type: integer
          turn_index:
            type: integer
          audio_ms:
            type: integer
          prob:
            type: number
            minimum: 0
            maximum: 1
      description: |
        End-of-turn likelihood for display, with `results.eot_events: true`.
      examples:
        - payload:
            type: eot_prob
            seq: 13
            turn_index: 0
            audio_ms: 2200
            prob: 0.42

    AsrConfigured:
      name: configured
      title: Configure Result
      contentType: application/msgpack
      payload:
        type: object
        required:
          - type
          - seq
          - ok
          - config
        properties:
          type:
            type: string
            const: configured
            description: Message type identifier
          seq:
            type: integer
          ok:
            type: boolean
            description: "`false` means nothing changed."
          config:
            type: object
            description: The configuration in effect.
          message:
            type: string
            description: Present when `ok` is `false`. Why, in English, for humans.
      description: |
        The reply to `configure`.
      examples:
        - payload:
            type: configured
            seq: 1
            ok: false
            config:
              turn_detection:
                mode: auto
                eager: false
                silence_timeout_ms: 5000
            message: turn_detection.silence_timeout_ms must be between 3000 and 60000 in auto mode

    AsrProgress:
      name: progress
      title: Progress
      contentType: application/msgpack
      payload:
        type: object
        required:
          - type
          - seq
        properties:
          type:
            type: string
            const: progress
            description: Message type identifier
          seq:
            type: integer
          audio_received_ms:
            type: integer
          audio_processed_ms:
            type: integer
          audio_committed_ms:
            type: integer
      description: |
        Watermarks only, every 5 seconds while the client sends nothing.
      examples:
        - payload:
            type: progress
            seq: 30
            audio_received_ms: 12000
            audio_processed_ms: 12000
            audio_committed_ms: 9600

    AsrError:
      name: error
      title: Error
      contentType: application/msgpack
      payload:
        type: object
        required:
          - type
          - seq
          - code
          - error_type
          - message
          - request_id
          - recoverable
        properties:
          type:
            type: string
            const: error
            description: Message type identifier
          seq:
            type: integer
          code:
            type: integer
            enum:
              - 400
              - 408
              - 413
              - 500
              - 503
              - 504
            description: HTTP-style status.
          error_type:
            type: string
            enum:
              - invalid_config
              - unsupported_audio
              - invalid_request
              - idle_timeout
              - max_duration_exceeded
              - frame_too_large
              - engine_error
              - internal
              - server_restarting
            description: Match on this field, not on `message`.
          message:
            type: string
            description: A short English description, for humans. Do not parse it.
          request_id:
            type: string
          recoverable:
            type: boolean
            description: |
              `true` when the session continues, except for
              `server_restarting`, which commits the open turn and closes
              with 1012 so you can reconnect.
      description: |
        An error. When `recoverable` is `false`, the server closes the
        connection (close codes 4400, 4408, 4413, 4500 or 1009).
        `idle_timeout` (close 4408) comes after 30 seconds without any
        client message, or when no `config` arrives within 10 seconds of
        connecting. `server_restarting` is recoverable but still closes
        with 1012: reconnect for a new session.
      examples:
        - payload:
            type: error
            seq: 1
            code: 400
            error_type: unsupported_audio
            message: audio.sample_rate must be one of 8000, 12000, 16000, 22050, 24000, 32000, 44100, 48000
            request_id: 0b6f4c1e-7d2a-4e8b-9f3c-5a1d2e3f4b6c
            recoverable: false

    AsrSessionDone:
      name: session_done
      title: Session Done
      contentType: application/msgpack
      payload:
        type: object
        required:
          - type
          - seq
          - stats
        properties:
          type:
            type: string
            const: session_done
            description: Message type identifier
          seq:
            type: integer
          stats:
            type: object
            properties:
              audio_ms:
                type: integer
                description: Audio received in the session.
              turns:
                type: integer
                description: Every committed turn, user turn or not.
              request_id:
                type: string
      description: |
        Sent after `audio_done`, just before the server closes with 1000.
      examples:
        - payload:
            type: session_done
            seq: 12
            stats:
              audio_ms: 8960
              turns: 3
              request_id: 0b6f4c1e-7d2a-4e8b-9f3c-5a1d2e3f4b6c

  schemas:
    AsrAudioFormat:
      type: object
      required:
        - format
        - sample_rate
        - channels
      properties:
        format:
          type: string
          const: pcm_s16le
          description: 16-bit little-endian PCM.
        sample_rate:
          type: integer
          enum:
            - 8000
            - 12000
            - 16000
            - 22050
            - 24000
            - 32000
            - 44100
            - 48000
          description: Sample rate in Hz. Rates other than 16000 are converted on the server; you never need to resample.
        channels:
          type: integer
          const: 1
          description: Mono only.

    AsrTurnDetection:
      type: object
      properties:
        mode:
          type: string
          enum:
            - auto
            - vad
            - manual
          default: auto
          description: |
            auto: the server's turn detection decides when the user has
            finished, and tells user turns from noise and other voices.
            vad: a turn ends after `silence_timeout_ms` of silence.
            manual: a turn ends when you send `finalize`.
        eager:
          type: boolean
          default: false
          description: Send `eager_end_of_turn` in auto mode.
        silence_timeout_ms:
          type: integer
          description: |
            auto: default 5000, allowed 3000–60000 (a safety net for user
            turns). vad: default 700, allowed 300–60000 (the silence that
            ends a turn). manual: default 60000, allowed 300–60000 (a safety
            net). Checked against the mode it will run under.

    AsrResults:
      type: object
      properties:
        drafts:
          type: boolean
          default: false
          description: Send live `draft` messages.
        ignore_timestamps:
          type: boolean
          default: true
          description: "`false` adds `words` with timings to `committed`."
        diarize:
          oneOf:
            - type: boolean
            - type: string
              enum:
                - auto
                - "true"
                - "false"
          default: true
          description: Speaker tags in the text. `auto` is the same as `true`; `false` removes them. The strings `"true"` and `"false"` are accepted too.
        vad_events:
          type: boolean
          default: false
          description: Send `vad` messages.
        eot_events:
          type: boolean
          default: false
          description: Send `eot_prob` messages.

    AsrTurnDetectionUpdate:
      description: Turn detection changes in `configure`. Omitted fields keep their current values.
      type: object
      properties:
        mode:
          type: string
          enum:
            - auto
            - vad
            - manual
          description: |
            auto: the server's turn detection decides when the user has
            finished, and tells user turns from noise and other voices.
            vad: a turn ends after `silence_timeout_ms` of silence.
            manual: a turn ends when you send `finalize`.
        eager:
          type: boolean
          description: Send `eager_end_of_turn` in auto mode.
        silence_timeout_ms:
          type: integer
          description: |
            auto: default 5000, allowed 3000–60000 (a safety net for user
            turns). vad: default 700, allowed 300–60000 (the silence that
            ends a turn). manual: default 60000, allowed 300–60000 (a safety
            net). Checked against the mode it will run under.

    AsrResultsUpdate:
      description: Result changes in `configure`. Omitted fields keep their current values.
      type: object
      properties:
        drafts:
          type: boolean
          description: Send live `draft` messages.
        ignore_timestamps:
          type: boolean
          description: "`false` adds `words` with timings to `committed`."
        diarize:
          oneOf:
            - type: boolean
            - type: string
              enum:
                - auto
                - "true"
                - "false"
          description: Speaker tags in the text. `auto` is the same as `true`; `false` removes them. The strings `"true"` and `"false"` are accepted too.
        vad_events:
          type: boolean
          description: Send `vad` messages.
        eot_events:
          type: boolean
          description: Send `eot_prob` messages.

    AsrContext:
      type: object
      properties:
        history:
          type: array
          maxItems: 32
          items:
            $ref: "#/components/schemas/AsrContextItem"
          description: Earlier conversation, oldest first.
        terms:
          type: array
          maxItems: 100
          items:
            type: string
            maxLength: 32
          description: Names, products and jargon to recognize.

    AsrContextItem:
      type: object
      required:
        - role
        - text
      properties:
        role:
          type: string
          enum:
            - user
            - assistant
        text:
          type: string
          maxLength: 2000

    AsrWord:
      type: object
      required:
        - text
        - start_ms
        - end_ms
      properties:
        text:
          type: string
        start_ms:
          type: integer
        end_ms:
          type: integer

    AsrLimits:
      type: object
      properties:
        max_session_ms:
          type: integer
          description: Maximum session length (3600000).
        max_turn_ms:
          type: integer
          description: Maximum turn length (60000).
        max_frame_bytes:
          type: integer
          description: Maximum message size (1048576).

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        API key authentication using Bearer token.

        Get your API key from https://fish.audio/app/api-keys

        Pass the token in the Authorization header:
        `Authorization: Bearer YOUR_API_KEY`
