asyncapi: 3.0.0

info:
  title: Fish Audio WebSocket API
  version: 1.0.0
  description: |
    Real-time text-to-speech and speech-to-text streaming via WebSocket using MessagePack serialization.

    ## Protocol Overview

    The WebSocket TTS endpoint enables bidirectional streaming for low-latency text-to-speech generation:

    1. **Client** connects to `/v1/tts/live` with model and auth headers
    2. **Client** sends StartEvent with TTS configuration
    3. **Client** streams TextEvent messages with text chunks
    4. **Server** streams back AudioEvent messages with generated audio
    5. **Client** sends CloseEvent to signal completion
    6. **Server** sends FinishEvent and closes connection

    The realtime speech-to-text endpoint streams audio in and transcripts out:

    1. **Client** connects to `/v1/asr/realtime` with auth headers
    2. **Client** sends `config`, and the **Server** answers with `session_started`
    3. **Client** streams `audio` messages
    4. **Server** sends turn events (`speech_start`, `user_turn_taken`, `eager_end_of_turn`) and a `committed` transcript per turn
    5. **Client** sends `audio_done`; the **Server** sends `session_done` and closes the connection

    ## Message Serialization

    All messages are serialized using **MessagePack** (binary format) before sending over the WebSocket.

    ## Common Use Cases

    - Conversational AI with streaming responses
    - Live captioning and narration
    - Real-time dubbing and voice-overs
    - Interactive voice applications
    - Voice agents that listen and respond in real time

servers:
  production:
    host: api.fish.audio
    protocol: wss
    description: Fish Audio production WebSocket server
    security:
      - $ref: "#/components/securitySchemes/bearerAuth"

channels:
  ttsLive:
    address: /v1/tts/live
    messages:
      startEvent:
        $ref: "#/components/messages/StartEvent"
      textEvent:
        $ref: "#/components/messages/TextEvent"
      flushEvent:
        $ref: "#/components/messages/FlushEvent"
      closeEvent:
        $ref: "#/components/messages/CloseEvent"
      audioEvent:
        $ref: "#/components/messages/AudioEvent"
      finishEvent:
        $ref: "#/components/messages/FinishEvent"
    bindings:
      ws:
        headers:
          type: object
          properties:
            model:
              type: string
              enum:
                - s1
                - s2-pro
                - s2.1-pro
                - s2.1-pro-free
                - drama-3
              description: TTS model to use for this session. If omitted or set to an unrecognized value, the session falls back to `s2.1-pro`. Use `s2-pro` or an S2.1-Pro model for multi-speaker dialogue synthesis. `s1` is deprecated and will be retired on December 31, 2026. After that date, requests that specify `s1` are served by `s2.1-pro`.
    description: |
      Real-time TTS streaming channel. Clients send text chunks and receive audio chunks concurrently.

      ## Connection Headers
      - `Authorization: Bearer <api_key>` - Required for authentication (see security section)
      - `model: <model_name>` - Optional; specifies which TTS model to use (see bindings). Falls back to `s2.1-pro` when omitted or unrecognized

  ttsLiveWithTimestamps:
    address: /v1/tts/live/with-timestamp
    messages:
      startEvent:
        $ref: "#/components/messages/StartEvent"
      textEvent:
        $ref: "#/components/messages/TextEvent"
      flushEvent:
        $ref: "#/components/messages/FlushEvent"
      closeEvent:
        $ref: "#/components/messages/CloseEvent"
      timestampAudioEvent:
        $ref: "#/components/messages/TimestampAudioEvent"
      timestampFinishEvent:
        $ref: "#/components/messages/TimestampFinishEvent"
      errorEvent:
        $ref: "#/components/messages/ErrorEvent"
    bindings:
      ws:
        headers:
          type: object
          properties:
            model:
              type: string
              enum:
                - s1
                - s2-pro
                - s2.1-pro
                - s2.1-pro-free
                - drama-3
              description: TTS model to use for this session. If omitted or set to an unrecognized value, the session falls back to `s2.1-pro`. `s1` is deprecated and will be retired on December 31, 2026. After that date, requests that specify `s1` are served by `s2.1-pro`.
    description: |
      Real-time TTS streaming channel with word-level timestamps. Clients send
      text chunks and receive audio chunks with alignment metadata concurrently.

      ## Connection Headers
      - `Authorization: Bearer <api_key>` - Required for authentication (see security section)
      - `model: <model_name>` - Optional; specifies which TTS model to use (see bindings). Falls back to `s2.1-pro` when omitted or unrecognized

  asrRealtime:
    address: /v1/asr/realtime
    messages:
      config:
        $ref: "#/components/messages/AsrConfig"
      audio:
        $ref: "#/components/messages/AsrAudio"
      finalize:
        $ref: "#/components/messages/AsrFinalize"
      configure:
        $ref: "#/components/messages/AsrConfigure"
      contextAdd:
        $ref: "#/components/messages/AsrContextAdd"
      keepalive:
        $ref: "#/components/messages/AsrKeepalive"
      audioDone:
        $ref: "#/components/messages/AsrAudioDone"
      agentSpeaking:
        $ref: "#/components/messages/AsrAgentSpeaking"
      sessionStarted:
        $ref: "#/components/messages/AsrSessionStarted"
      speechStart:
        $ref: "#/components/messages/AsrSpeechStart"
      userTurnTaken:
        $ref: "#/components/messages/AsrUserTurnTaken"
      draft:
        $ref: "#/components/messages/AsrDraft"
      eagerEndOfTurn:
        $ref: "#/components/messages/AsrEagerEndOfTurn"
      turnResumed:
        $ref: "#/components/messages/AsrTurnResumed"
      userBackchannel:
        $ref: "#/components/messages/AsrUserBackchannel"
      committed:
        $ref: "#/components/messages/AsrCommitted"
      vad:
        $ref: "#/components/messages/AsrVad"
      eotProb:
        $ref: "#/components/messages/AsrEotProb"
      configured:
        $ref: "#/components/messages/AsrConfigured"
      progress:
        $ref: "#/components/messages/AsrProgress"
      error:
        $ref: "#/components/messages/AsrError"
      sessionDone:
        $ref: "#/components/messages/AsrSessionDone"
    bindings:
      ws:
        headers:
          type: object
          properties:
            model:
              type: string
              enum:
                - transcribe-1-pro-realtime
              default: transcribe-1-pro-realtime
              description: Realtime speech-to-text model. Optional; `transcribe-1-pro-realtime` is the default and the only realtime model. Any other value is refused with HTTP 400.
    description: |
      Realtime speech-to-text channel. Clients stream audio and receive
      transcripts turn by turn, with turn detection, optional live drafts and
      conversation context.

      ## Connection Headers
      - `Authorization: Bearer <api_key>` - Required for authentication (see security section)
      - `model: transcribe-1-pro-realtime` - Optional; the default

      Every message in both directions is one MessagePack map in a binary
      frame, with a `type` field. Send `config` first, wait for
      `session_started`, then stream `audio`. Ignore fields and message types
      you do not know: version 1 only adds them.

operations:
  receiveText:
    action: receive
    channel:
      $ref: "#/channels/ttsLive"
    messages:
      - $ref: "#/channels/ttsLive/messages/startEvent"
      - $ref: "#/channels/ttsLive/messages/textEvent"
      - $ref: "#/channels/ttsLive/messages/flushEvent"
      - $ref: "#/channels/ttsLive/messages/closeEvent"
    description: |
      Server receives text and control events from the client.

      **Event Sequence:**
      1. Client sends StartEvent once at the beginning with TTS configuration
      2. Client sends TextEvent for each text chunk to synthesize
      3. Client optionally sends FlushEvent to force immediate synthesis of buffered text
      4. Client sends CloseEvent when all text has been sent

  sendAudio:
    action: send
    channel:
      $ref: "#/channels/ttsLive"
    messages:
      - $ref: "#/channels/ttsLive/messages/audioEvent"
      - $ref: "#/channels/ttsLive/messages/finishEvent"
    description: |
      Server sends audio chunks and completion events to the client.

      **Event Flow:**
      - Server sends AudioEvent messages as audio is generated (multiple times)
      - Server sends FinishEvent once when synthesis completes
      - Clients should ignore unknown events to support future protocol extensions

  receiveTimestampedText:
    action: receive
    channel:
      $ref: "#/channels/ttsLiveWithTimestamps"
    messages:
      - $ref: "#/channels/ttsLiveWithTimestamps/messages/startEvent"
      - $ref: "#/channels/ttsLiveWithTimestamps/messages/textEvent"
      - $ref: "#/channels/ttsLiveWithTimestamps/messages/flushEvent"
      - $ref: "#/channels/ttsLiveWithTimestamps/messages/closeEvent"
    description: |
      Server receives text and control events from the client.

      **Event Sequence:**
      1. Client sends StartEvent once at the beginning with TTS configuration
      2. Client sends TextEvent for each text chunk to synthesize
      3. Client optionally sends FlushEvent to force immediate synthesis of buffered text
      4. Client sends CloseEvent when all text has been sent

  sendTimestampedAudio:
    action: send
    channel:
      $ref: "#/channels/ttsLiveWithTimestamps"
    messages:
      - $ref: "#/channels/ttsLiveWithTimestamps/messages/timestampAudioEvent"
      - $ref: "#/channels/ttsLiveWithTimestamps/messages/timestampFinishEvent"
      - $ref: "#/channels/ttsLiveWithTimestamps/messages/errorEvent"
    description: |
      Server sends audio chunks with word-level alignment metadata and completion events.

      **Event Flow:**
      - Server sends TimestampAudioEvent messages as audio is generated (multiple times)
      - Server sends TimestampFinishEvent once when synthesis completes
      - Server can send ErrorEvent when it cannot start or continue synthesis
      - Clients should ignore unknown events to support future protocol extensions

  receiveAsrClientMessages:
    action: receive
    channel:
      $ref: "#/channels/asrRealtime"
    messages:
      - $ref: "#/channels/asrRealtime/messages/config"
      - $ref: "#/channels/asrRealtime/messages/audio"
      - $ref: "#/channels/asrRealtime/messages/finalize"
      - $ref: "#/channels/asrRealtime/messages/configure"
      - $ref: "#/channels/asrRealtime/messages/contextAdd"
      - $ref: "#/channels/asrRealtime/messages/keepalive"
      - $ref: "#/channels/asrRealtime/messages/audioDone"
      - $ref: "#/channels/asrRealtime/messages/agentSpeaking"
    description: |
      Server receives configuration, audio and control messages from the client.

      **Message Sequence:**
      1. Client sends `config` once, as the first message, within 10 seconds of connecting
      2. Client streams `audio` after `session_started`, 80–100 ms per message
      3. Client can send `finalize`, `configure`, `context_add`, `keepalive` and `agent_speaking` at any time
      4. Client sends `audio_done` when there is no more audio

  sendAsrServerMessages:
    action: send
    channel:
      $ref: "#/channels/asrRealtime"
    messages:
      - $ref: "#/channels/asrRealtime/messages/sessionStarted"
      - $ref: "#/channels/asrRealtime/messages/speechStart"
      - $ref: "#/channels/asrRealtime/messages/userTurnTaken"
      - $ref: "#/channels/asrRealtime/messages/draft"
      - $ref: "#/channels/asrRealtime/messages/eagerEndOfTurn"
      - $ref: "#/channels/asrRealtime/messages/turnResumed"
      - $ref: "#/channels/asrRealtime/messages/userBackchannel"
      - $ref: "#/channels/asrRealtime/messages/committed"
      - $ref: "#/channels/asrRealtime/messages/vad"
      - $ref: "#/channels/asrRealtime/messages/eotProb"
      - $ref: "#/channels/asrRealtime/messages/configured"
      - $ref: "#/channels/asrRealtime/messages/progress"
      - $ref: "#/channels/asrRealtime/messages/error"
      - $ref: "#/channels/asrRealtime/messages/sessionDone"
    description: |
      Server sends session, turn and transcript messages to the client.

      **Event Flow:**
      - Server sends `session_started` once, after a valid `config`
      - For each turn: `speech_start`, then optional `draft` messages, `user_turn_taken` (auto mode), optional `eager_end_of_turn` / `turn_resumed`, and exactly one `committed`
      - Server sends `user_backchannel` in auto mode while the client reports `agent_speaking: true`
      - Server sends `session_done` after `audio_done`, then closes with 1000
      - Clients should ignore unknown messages and fields to support future protocol extensions

components:
  messages:
    StartEvent:
      name: StartEvent
      title: Start TTS Session
      contentType: application/msgpack
      payload:
        type: object
        required:
          - event
          - request
        properties:
          event:
            type: string
            const: start
            description: Event type identifier
          request:
            $ref: "#/components/schemas/WebSocketTTSRequest"
      description: |
        Initiates a TTS streaming session with configuration.

        This must be the first message sent after connecting. It contains all the
        configuration for voice, audio format, and generation parameters.

        The `request` payload uses the same fields as the HTTP TTS API. In
        WebSocket mode, `request.text` is typically empty in the StartEvent and
        the actual text is streamed through subsequent TextEvent messages.

        For full parameter details, examples, and model-specific guidance, see
        the HTTP [Text to Speech API](/api-reference/endpoint/openapi-v1/text-to-speech).
      examples:
        - name: Basic Configuration
          payload:
            event: start
            request:
              text: ""
              format: mp3
              chunk_length: 300
              reference_id: "9a9cf47702da476aa4629e2506d4a857"
              latency: normal
        - name: Full Configuration with All Options
          payload:
            event: start
            request:
              text: ""
              max_new_tokens: 1024
              top_p: 0.7
              repetition_penalty: 1.2
              temperature: 0.7
              min_chunk_length: 50
              chunk_length: 300
              condition_on_previous_chunks: true
              normalize: true
              early_stop_threshold: 1.0
              format: mp3
              sample_rate: 44100
              mp3_bitrate: 128
              opus_bitrate: -1000
              references: []
              reference_id: "9a9cf47702da476aa4629e2506d4a857"
              latency: normal
              prosody:
                speed: 1.2
                volume: 2.0
                normalize_loudness: true
        - name: Voice Cloning with Reference Audio
          payload:
            event: start
            request:
              text: ""
              format: wav
              chunk_length: 250
              references:
                - audio: <binary audio data>
                  text: "This is the reference audio transcript."
              normalize: true
              latency: normal
              prosody:
                speed: 1.0
                volume: 0.0
                normalize_loudness: true

    TextEvent:
      name: TextEvent
      title: Send Text Chunk
      contentType: application/msgpack
      payload:
        type: object
        required:
          - event
          - text
        properties:
          event:
            type: string
            const: text
            description: Event type identifier
          text:
            type: string
            description: Text chunk to synthesize
      description: |
        Sends a chunk of text for synthesis.

        You can send multiple TextEvent messages in sequence. The server will buffer
        and synthesize text according to the chunk_length parameter from StartEvent.
      examples:
        - payload:
            event: text
            text: "Hello, this is streaming text. "

    FlushEvent:
      name: FlushEvent
      title: Flush Buffered Text
      contentType: application/msgpack
      payload:
        type: object
        required:
          - event
        properties:
          event:
            type: string
            const: flush
            description: Event type identifier
      description: |
        Forces immediate synthesis of all buffered text.

        Use this when you want audio generated immediately without waiting for more
        text or for the buffer to fill up. Useful for ensuring low latency in
        interactive applications.
      examples:
        - payload:
            event: flush

    CloseEvent:
      name: CloseEvent
      title: End TTS Session
      contentType: application/msgpack
      payload:
        type: object
        required:
          - event
        properties:
          event:
            type: string
            const: stop
            description: Event type identifier (note 'stop', not 'close')
      description: |
        Signals the end of the text stream.

        After sending this event, the server will finish synthesizing any remaining
        buffered text and send a FinishEvent before closing the connection.
      examples:
        - payload:
            event: stop

    AudioEvent:
      name: AudioEvent
      title: Audio Chunk
      contentType: application/msgpack
      payload:
        type: object
        required:
          - event
          - audio
        properties:
          event:
            type: string
            const: audio
            description: Event type identifier
          audio:
            type: string
            format: binary
            description: Audio bytes in the format specified in StartEvent (mp3, wav, pcm, or opus)
      description: |
        Contains generated audio bytes.

        You will receive multiple AudioEvent messages as audio is generated. Each
        message contains a chunk of audio in the format you specified. Concatenate
        all chunks to get the complete audio.
      examples:
        - payload:
            event: audio
            audio: <binary audio data>

    FinishEvent:
      name: FinishEvent
      title: Session Complete
      contentType: application/msgpack
      payload:
        type: object
        required:
          - event
          - reason
        properties:
          event:
            type: string
            const: finish
            description: Event type identifier
          reason:
            type: string
            enum:
              - stop
              - error
            description: |
              Completion reason:
              - 'stop': Normal completion
              - 'error': An error occurred during synthesis
      description: |
        Signals that the TTS session has completed.

        - If reason='stop', synthesis completed successfully
        - If reason='error', an error occurred (client should handle gracefully)

        The WebSocket connection will close after this event.
      examples:
        - payload:
            event: finish
            reason: stop
        - payload:
            event: finish
            reason: error

    TimestampAudioEvent:
      name: TimestampAudioEvent
      title: Audio Chunk with Timestamps
      contentType: application/msgpack
      payload:
        type: object
        required:
          - event
          - audio
          - content
          - alignment
          - chunk_seq
          - chunk_audio_offset_sec
        properties:
          event:
            type: string
            const: audio
            description: Event type identifier
          audio:
            type: string
            format: binary
            description: Raw audio bytes. The value may be empty on a trailing frame that only carries a final alignment correction.
          content:
            type: string
            description: Text content of the chunk identified by `chunk_seq`.
          alignment:
            anyOf:
              - $ref: "#/components/schemas/TimestampAlignment"
              - type: "null"
            description: Cumulative word-level alignment snapshot for `chunk_seq`. Replace the stored snapshot when this value is non-null; do not append it.
          chunk_seq:
            type: integer
            minimum: 0
            description: Monotonically non-decreasing sequence number for the text chunk described by `content` and `alignment`. Do not use it to attribute audio bytes.
          chunk_audio_offset_sec:
            type: number
            minimum: 0
            description: Start time of this text chunk within the full audio, in seconds. Add it to a segment's `start` or `end` to get its absolute timestamp.
          time:
            anyOf:
              - type: number
              - type: "null"
            default: null
            description: Milliseconds since the server began the session.
      description: |
        Contains generated audio bytes and the latest word-level alignment snapshot.

        Concatenate every `audio` payload in arrival order to reconstruct the
        complete audio. Alignment is cumulative for each `chunk_seq`, and segment
        times are relative to that chunk.
      examples:
        - payload:
            event: audio
            audio: <binary audio data>
            content: "Hello there."
            alignment:
              segments:
                - text: "Hello"
                  start: 0.0
                  end: 0.42
                - text: "there."
                  start: 0.42
                  end: 0.86
              audio_duration: 0.86
            chunk_seq: 0
            chunk_audio_offset_sec: 0.0
            time: 920

    TimestampFinishEvent:
      name: TimestampFinishEvent
      title: Timestamped Session Complete
      contentType: application/msgpack
      payload:
        type: object
        required:
          - event
          - reason
        properties:
          event:
            type: string
            const: finish
            description: Event type identifier
          reason:
            type: string
            enum:
              - stop
              - error
            description: "`stop` for normal completion or `error` when the server aborted synthesis."
          message:
            anyOf:
              - type: string
              - type: "null"
            default: null
            description: Failure detail. Present when `reason` is `error`.
          time:
            anyOf:
              - type: number
              - type: "null"
            default: null
            description: Milliseconds since the server began the session.
      description: |
        Signals that the timestamped TTS session has completed. After receiving
        this event, you can send another StartEvent on the same connection.
      examples:
        - payload:
            event: finish
            reason: stop
            time: 5460

    ErrorEvent:
      name: ErrorEvent
      title: Request Error
      contentType: application/msgpack
      payload:
        type: object
        required:
          - event
          - error
        properties:
          event:
            type: string
            const: error
            description: Event type identifier
          error:
            type: string
            description: Failure detail.
          max_concurrency:
            anyOf:
              - type: integer
              - type: "null"
            default: null
            description: Your account's concurrency limit. Present when the connection is refused for exceeding it.
      description: |
        Reports a request-level failure, such as an invalid StartEvent, a missing
        voice reference, or a concurrency refusal. The socket closes afterwards.
      examples:
        - payload:
            event: error
            error: Concurrency limit exceeded
            max_concurrency: 8

    AsrConfig:
      name: config
      title: Configure the Session
      contentType: application/msgpack
      payload:
        type: object
        required:
          - type
          - audio
        properties:
          type:
            type: string
            const: config
            description: Message type identifier
          protocol_version:
            type: integer
            const: 1
            default: 1
            description: Optional. Only `1` is valid.
          audio:
            $ref: "#/components/schemas/AsrAudioFormat"
          turn_detection:
            $ref: "#/components/schemas/AsrTurnDetection"
          results:
            $ref: "#/components/schemas/AsrResults"
          context:
            $ref: "#/components/schemas/AsrContext"
          client_reference_id:
            type: string
            maxLength: 256
            description: Your own ID for the session. Recorded with the session; not sent back.
      description: |
        The first message on the connection. Send it within 10 seconds of
        connecting, then wait for `session_started` before sending audio.
        An invalid `config` is answered with an `error` (`invalid_config` or
        `unsupported_audio`) and close code 4400.
      examples:
        - name: Voice agent
          payload:
            type: config
            audio:
              format: pcm_s16le
              sample_rate: 16000
              channels: 1
            turn_detection:
              mode: auto
              eager: true
            context:
              terms:
                - Fish Audio
        - name: Live captions
          payload:
            type: config
            audio:
              format: pcm_s16le
              sample_rate: 48000
              channels: 1
            results:
              drafts: true
              diarize: false

    AsrAudio:
      name: audio
      title: Send Audio
      contentType: application/msgpack
      payload:
        type: object
        required:
          - type
          - data
        properties:
          type:
            type: string
            const: audio
            description: Message type identifier
          data:
            type: string
            format: binary
            description: PCM bytes in the configured format, as MessagePack `bin`. Any length; an odd trailing byte waits for the next message.
      description: |
        Audio in the format from `config`. Send it after `session_started`;
        80–100 ms per message is a good size. A message can be at most 1 MiB.
      examples:
        - payload:
            type: audio
            data: <binary PCM audio>

    AsrFinalize:
      name: finalize
      title: Commit the Current Turn
      contentType: application/msgpack
      payload:
        type: object
        required:
          - type
        properties:
          type:
            type: string
            const: finalize
            description: Message type identifier
      description: |
        Commits the current turn now, with `reason: "finalize"`. Ignored when
        no turn is open. In auto mode the turn it ends is always a user turn.
        Use it for push-to-talk (manual mode) when the button is released.
      examples:
        - payload:
            type: finalize

    AsrConfigure:
      name: configure
      title: Change Settings
      contentType: application/msgpack
      payload:
        type: object
        required:
          - type
        properties:
          type:
            type: string
            const: configure
            description: Message type identifier
          turn_detection:
            $ref: "#/components/schemas/AsrTurnDetection"
          results:
            $ref: "#/components/schemas/AsrResults"
          context:
            type: object
            properties:
              terms:
                type: array
                maxItems: 100
                items:
                  type: string
                  maxLength: 32
                description: Replaces the list of terms.
      description: |
        Changes settings during the session. Answered by `configured`. If any
        value is invalid, nothing in the message is applied. When `mode`
        changes to or from `auto`, `configured` can take a few seconds.
      examples:
        - payload:
            type: configure
            turn_detection:
              mode: vad
              silence_timeout_ms: 900
        - payload:
            type: configure
            context:
              terms:
                - Fish Audio
                - Main Street

    AsrContextAdd:
      name: context_add
      title: Add Conversation Context
      contentType: application/msgpack
      payload:
        type: object
        required:
          - type
          - items
        properties:
          type:
            type: string
            const: context_add
            description: Message type identifier
          items:
            type: array
            maxItems: 32
            items:
              $ref: "#/components/schemas/AsrContextItem"
            description: Conversation items, oldest first. Send each line your agent speaks as an `assistant` item.
          reset_history:
            type: boolean
            default: false
            description: First drop the items you added before.
      description: |
        Adds conversation context. Committed user turns are added
        automatically; send what the other party (your agent) said, ideally
        right after the `committed` it answers. No reply.
      examples:
        - payload:
            type: context_add
            items:
              - role: assistant
                text: Sure. Which day works for you?

    AsrKeepalive:
      name: keepalive
      title: Keep the Session Open
      contentType: application/msgpack
      payload:
        type: object
        required:
          - type
        properties:
          type:
            type: string
            const: keepalive
            description: Message type identifier
      description: |
        Keeps an idle session open. A session closes after 30 seconds without
        any client message.
      examples:
        - payload:
            type: keepalive

    AsrAudioDone:
      name: audio_done
      title: End of Audio
      contentType: application/msgpack
      payload:
        type: object
        required:
          - type
        properties:
          type:
            type: string
            const: audio_done
            description: Message type identifier
      description: |
        No more audio. The server commits the open turn
        (`reason: "audio_done"`), sends `session_done`, and closes with 1000.
      examples:
        - payload:
            type: audio_done

    AsrAgentSpeaking:
      name: agent_speaking
      title: Agent Speaking State
      contentType: application/msgpack
      payload:
        type: object
        required:
          - type
          - speaking
        properties:
          type:
            type: string
            const: agent_speaking
            description: Message type identifier
          speaking:
            type: boolean
            description: |
              `true` when you commit to playing a reply (typically on
              `committed`); `false` when its last sample has played or you
              stop it. Default: not speaking.
      description: |
        For voice agents in auto mode. While the agent is speaking, a short
        acknowledgement from the user produces `user_backchannel` instead of
        `user_turn_taken`. Applies at its position in the audio stream; send
        it on the same connection as your audio, only when the value changes.
        No effect in vad and manual mode.
      examples:
        - payload:
            type: agent_speaking
            speaking: true

    AsrSessionStarted:
      name: session_started
      title: Session Started
      contentType: application/msgpack
      payload:
        type: object
        required:
          - type
          - seq
          - session_id
          - request_id
          - config
          - limits
        properties:
          type:
            type: string
            const: session_started
            description: Message type identifier
          seq:
            type: integer
            description: Message sequence number, increasing by one per server message.
          session_id:
            type: string
            description: The session's ID.
          request_id:
            type: string
            description: Same as the `x-request-id` response header. Include it when you contact support.
          config:
            type: object
            description: The effective configuration, with defaults filled in.
          limits:
            $ref: "#/components/schemas/AsrLimits"
      description: |
        The session is ready. Send audio after this message.
      examples:
        - payload:
            type: session_started
            seq: 0
            session_id: s_ab12cd34
            request_id: 0b6f4c1e-7d2a-4e8b-9f3c-5a1d2e3f4b6c
            config:
              audio:
                format: pcm_s16le
                sample_rate: 16000
                channels: 1
              turn_detection:
                mode: auto
                eager: true
                silence_timeout_ms: 5000
            limits:
              max_session_ms: 3600000
              max_turn_ms: 60000
              max_frame_bytes: 1048576

    AsrSpeechStart:
      name: speech_start
      title: Turn Opened
      contentType: application/msgpack
      payload:
        type: object
        required:
          - type
          - seq
          - turn_index
          - audio_ms
        properties:
          type:
            type: string
            const: speech_start
            description: Message type identifier
          seq:
            type: integer
          turn_index:
            type: integer
            description: The turn that opened, counting from 0.
          audio_ms:
            type: integer
            description: Where the turn starts, slightly before the speech.
      description: |
        A turn opened on voice activity. In auto mode, noise and other voices
        open turns too: wait for `user_turn_taken` before treating it as the
        user's turn.
      examples:
        - payload:
            type: speech_start
            seq: 1
            turn_index: 0
            audio_ms: 300

    AsrUserTurnTaken:
      name: user_turn_taken
      title: User Took the Turn
      contentType: application/msgpack
      payload:
        type: object
        required:
          - type
          - seq
          - turn_index
          - audio_ms
        properties:
          type:
            type: string
            const: user_turn_taken
            description: Message type identifier
          seq:
            type: integer
          turn_index:
            type: integer
          audio_ms:
            type: integer
            description: Where the server judged that the user took the turn.
      description: |
        Auto mode only: the server judged that the user is taking their turn.
        At most once per turn, before any `eager_end_of_turn`. For a voice
        agent that is speaking, this is the signal to stop (barge-in).
      examples:
        - payload:
            type: user_turn_taken
            seq: 3
            turn_index: 0
            audio_ms: 1280

    AsrDraft:
      name: draft
      title: Draft Transcript
      contentType: application/msgpack
      payload:
        type: object
        required:
          - type
          - seq
          - turn_index
          - text
          - audio_ms
        properties:
          type:
            type: string
            const: draft
            description: Message type identifier
          seq:
            type: integer
          turn_index:
            type: integer
          text:
            type: string
            description: The whole turn so far. Replaces the previous draft. Not final.
          language:
            type: string
            description: Optional. English name of the detected language.
          language_code:
            type: string
            description: Optional. ISO 639-1 code of the detected language.
          audio_ms:
            type: integer
            description: The audio position the draft covers up to.
          audio_received_ms:
            type: integer
          audio_processed_ms:
            type: integer
          audio_committed_ms:
            type: integer
      description: |
        Live draft of the open turn, with `results.drafts: true`. Best effort,
        at most every `draft_interval_ms`.
      examples:
        - payload:
            type: draft
            seq: 4
            turn_index: 0
            text: what's the weather like
            language: English
            language_code: en
            audio_ms: 1800
            audio_received_ms: 1900
            audio_processed_ms: 1800
            audio_committed_ms: 0

    AsrEagerEndOfTurn:
      name: eager_end_of_turn
      title: Eager End of Turn
      contentType: application/msgpack
      payload:
        type: object
        required:
          - type
          - seq
          - turn_index
          - text
        properties:
          type:
            type: string
            const: eager_end_of_turn
            description: Message type identifier
          seq:
            type: integer
          turn_index:
            type: integer
          text:
            type: string
            description: Exactly what `committed` will say unless `turn_resumed` follows. Can be empty.
          language:
            type: string
          language_code:
            type: string
          audio_ms:
            type: integer
            description: Optional. The audio position of the signal.
      description: |
        With `turn_detection.eager: true` in auto mode, after
        `user_turn_taken`: the turn has probably ended. Start preparing your
        response; `turn_resumed` cancels it. Not every turn has one.
      examples:
        - payload:
            type: eager_end_of_turn
            seq: 5
            turn_index: 0
            text: What's the weather like?
            language: English
            language_code: en
            audio_ms: 2240

    AsrTurnResumed:
      name: turn_resumed
      title: Turn Resumed
      contentType: application/msgpack
      payload:
        type: object
        required:
          - type
          - seq
          - turn_index
        properties:
          type:
            type: string
            const: turn_resumed
            description: Message type identifier
          seq:
            type: integer
          turn_index:
            type: integer
      description: |
        The speaker went on after `eager_end_of_turn`: discard that text. If
        you already started playing a reply, stop it and send
        `agent_speaking: false`.
      examples:
        - payload:
            type: turn_resumed
            seq: 6
            turn_index: 0

    AsrUserBackchannel:
      name: user_backchannel
      title: User Backchannel
      contentType: application/msgpack
      payload:
        type: object
        required:
          - type
          - seq
          - turn_index
          - audio_ms
        properties:
          type:
            type: string
            const: user_backchannel
            description: Message type identifier
          seq:
            type: integer
          turn_index:
            type: integer
            description: The open turn, or the index the next turn will get when no turn is open.
          audio_ms:
            type: integer
            description: Where the acknowledgement is in the audio.
      description: |
        Auto mode only, while your agent is speaking: the user acknowledged
        ("mm-hm", "yeah") without taking the turn. Keep talking.
      examples:
        - payload:
            type: user_backchannel
            seq: 8
            turn_index: 1
            audio_ms: 3840

    AsrCommitted:
      name: committed
      title: Committed Turn
      contentType: application/msgpack
      payload:
        type: object
        required:
          - type
          - seq
          - turn_index
          - text
          - audio_start_ms
          - audio_end_ms
          - reason
          - degraded
          - user_turn
          - turn_kind
        properties:
          type:
            type: string
            const: committed
            description: Message type identifier
          seq:
            type: integer
          turn_index:
            type: integer
          text:
            type: string
            description: The final transcript of the turn. Can contain speaker tags such as `<|speaker:0|>`. Can be empty.
          words:
            type: array
            items:
              $ref: "#/components/schemas/AsrWord"
            description: Present when `results.ignore_timestamps` is `false` and the commit is not degraded.
          language:
            type: string
          language_code:
            type: string
          audio_start_ms:
            type: integer
          audio_end_ms:
            type: integer
          reason:
            type: string
            enum:
              - eot
              - finalize
              - silence_timeout
              - max_turn_duration
              - audio_done
            description: Why the turn ended. Treat an unknown value like `eot`.
          degraded:
            type: boolean
            description: "`true` when the final pass failed and the text comes from the last draft."
          user_turn:
            type: boolean
            description: "`true` for the user's turn. Decide whether to answer by this field. Treat a missing value as `true`."
          turn_kind:
            type: string
            enum:
              - user
              - backchannel
              - other
            description: "`user` exactly when `user_turn` is true. Treat an unknown value like `other` when `user_turn` is false."
          audio_received_ms:
            type: integer
          audio_processed_ms:
            type: integer
          audio_committed_ms:
            type: integer
      description: |
        The final transcript of a turn. Every turn has exactly one, and nothing
        about the turn follows it.
      examples:
        - payload:
            type: committed
            seq: 6
            turn_index: 0
            text: What's the weather like?
            language: English
            language_code: en
            audio_start_ms: 300
            audio_end_ms: 2880
            reason: eot
            degraded: false
            user_turn: true
            turn_kind: user
            audio_received_ms: 3000
            audio_processed_ms: 2900
            audio_committed_ms: 2880

    AsrVad:
      name: vad
      title: Voice Activity
      contentType: application/msgpack
      payload:
        type: object
        required:
          - type
          - seq
          - audio_ms
          - score
        properties:
          type:
            type: string
            const: vad
            description: Message type identifier
          seq:
            type: integer
          audio_ms:
            type: integer
          score:
            type: number
            minimum: 0
            maximum: 1
            description: Voice activity.
      description: |
        Voice activity, up to 10 per second, with `results.vad_events: true`.
      examples:
        - payload:
            type: vad
            seq: 12
            audio_ms: 1100
            score: 0.93

    AsrEotProb:
      name: eot_prob
      title: End-of-Turn Likelihood
      contentType: application/msgpack
      payload:
        type: object
        required:
          - type
          - seq
          - turn_index
          - audio_ms
          - prob
        properties:
          type:
            type: string
            const: eot_prob
            description: Message type identifier
          seq:
            type: integer
          turn_index:
            type: integer
          audio_ms:
            type: integer
          prob:
            type: number
            minimum: 0
            maximum: 1
      description: |
        End-of-turn likelihood for display, with `results.eot_events: true`.
      examples:
        - payload:
            type: eot_prob
            seq: 13
            turn_index: 0
            audio_ms: 2200
            prob: 0.42

    AsrConfigured:
      name: configured
      title: Configure Result
      contentType: application/msgpack
      payload:
        type: object
        required:
          - type
          - seq
          - ok
          - config
        properties:
          type:
            type: string
            const: configured
            description: Message type identifier
          seq:
            type: integer
          ok:
            type: boolean
            description: "`false` means nothing changed."
          config:
            type: object
            description: The configuration in effect.
          message:
            type: string
            description: Present when `ok` is `false`. Why, in English, for humans.
      description: |
        The reply to `configure`.
      examples:
        - payload:
            type: configured
            seq: 1
            ok: false
            config:
              turn_detection:
                mode: auto
                eager: false
                silence_timeout_ms: 5000
            message: turn_detection.silence_timeout_ms must be between 3000 and 60000 in auto mode

    AsrProgress:
      name: progress
      title: Progress
      contentType: application/msgpack
      payload:
        type: object
        required:
          - type
          - seq
        properties:
          type:
            type: string
            const: progress
            description: Message type identifier
          seq:
            type: integer
          audio_received_ms:
            type: integer
          audio_processed_ms:
            type: integer
          audio_committed_ms:
            type: integer
      description: |
        Watermarks only, every 5 seconds while the client sends nothing.
      examples:
        - payload:
            type: progress
            seq: 30
            audio_received_ms: 12000
            audio_processed_ms: 12000
            audio_committed_ms: 9600

    AsrError:
      name: error
      title: Error
      contentType: application/msgpack
      payload:
        type: object
        required:
          - type
          - seq
          - code
          - error_type
          - message
          - request_id
          - recoverable
        properties:
          type:
            type: string
            const: error
            description: Message type identifier
          seq:
            type: integer
          code:
            type: integer
            enum:
              - 400
              - 408
              - 413
              - 500
              - 503
              - 504
            description: HTTP-style status.
          error_type:
            type: string
            enum:
              - invalid_config
              - unsupported_audio
              - invalid_request
              - idle_timeout
              - max_duration_exceeded
              - frame_too_large
              - engine_error
              - internal
              - server_restarting
            description: Match on this field, not on `message`.
          message:
            type: string
            description: A fixed English sentence per error.
          request_id:
            type: string
          recoverable:
            type: boolean
            description: "`true` when the session continues."
      description: |
        An error. When `recoverable` is `false`, the server closes the
        connection (close codes 4400, 4408, 4413, 4500, 1009 or 1012).
      examples:
        - payload:
            type: error
            seq: 1
            code: 400
            error_type: unsupported_audio
            message: audio.sample_rate must be one of 8000, 12000, 16000, 22050, 24000, 32000, 44100, 48000
            request_id: 0b6f4c1e-7d2a-4e8b-9f3c-5a1d2e3f4b6c
            recoverable: false

    AsrSessionDone:
      name: session_done
      title: Session Done
      contentType: application/msgpack
      payload:
        type: object
        required:
          - type
          - seq
          - stats
        properties:
          type:
            type: string
            const: session_done
            description: Message type identifier
          seq:
            type: integer
          stats:
            type: object
            properties:
              audio_ms:
                type: integer
                description: Audio received in the session.
              turns:
                type: integer
                description: Every committed turn, user turn or not.
              request_id:
                type: string
      description: |
        Sent after `audio_done`, just before the server closes with 1000.
      examples:
        - payload:
            type: session_done
            seq: 12
            stats:
              audio_ms: 8960
              turns: 3
              request_id: 0b6f4c1e-7d2a-4e8b-9f3c-5a1d2e3f4b6c

  schemas:
    TimestampAlignment:
      type: object
      required:
        - segments
        - audio_duration
      properties:
        segments:
          type: array
          description: Ordered text timing segments for the generated audio.
          items:
            $ref: "#/components/schemas/TimestampSegment"
        audio_duration:
          type: number
          description: Audio duration in seconds for this alignment's content chunk.

    TimestampSegment:
      type: object
      required:
        - text
        - start
        - end
      properties:
        text:
          type: string
          description: Text segment covered by this timing entry.
        start:
          type: number
          description: Segment start time in seconds, relative to the beginning of the chunk.
        end:
          type: number
          description: Segment end time in seconds, relative to the beginning of the chunk.

    WebSocketTTSRequest:
      type: object
      description: |
        Request payload for text-to-speech synthesis in WebSocket StartEvent.
        It uses the same parameters as the HTTP [Text to Speech API](/api-reference/endpoint/openapi-v1/text-to-speech).
        Supports single-speaker synthesis on all compatible TTS models.
        Multi-speaker dialogue synthesis is available with `s2-pro` and the S2.1-Pro family.
        In WebSocket mode, `text` is usually empty in StartEvent and the actual
        content is sent through subsequent TextEvent messages.
      required:
        - text
      properties:
        text:
          type: string
          description: |
            Text to convert to speech. For WebSocket streaming, this is
            typically empty in the StartEvent and the actual text is sent via
            TextEvent messages.

        max_new_tokens:
          type: integer
          default: 1024
          description: |
            Maximum audio tokens to generate per text chunk.

        temperature:
          type: number
          minimum: 0.0
          maximum: 1.0
          default: 0.7
          description: |
            Controls expressiveness. Higher is more varied, lower is more
            consistent.

        top_p:
          type: number
          minimum: 0.0
          maximum: 1.0
          default: 0.7
          description: |
            Controls diversity via nucleus sampling.

        repetition_penalty:
          type: number
          default: 1.2
          description: |
            Penalty for repeating audio patterns. Values above 1.0 reduce
            repetition.

        min_chunk_length:
          type: integer
          minimum: 0
          maximum: 100
          default: 50
          description: |
            Minimum characters before splitting into a new chunk.

        references:
          anyOf:
            - description: "Single speaker: array of reference audio samples"
              type: array
              items:
                $ref: "#/components/schemas/WebSocketReferenceAudio"
            - description: "Multiple speakers: array of arrays, where each inner array contains reference samples for one speaker"
              type: array
              items:
                type: array
                items:
                  $ref: "#/components/schemas/WebSocketReferenceAudio"
            - type: "null"
          description: |
            Inline voice references for zero-shot cloning. Single-speaker uses
            an array of ReferenceAudio. Multi-speaker uses an array of speaker
            arrays. Multi-speaker dialogue is available with `s2-pro` and the S2.1-Pro family.
            See the HTTP Text to Speech API page for detailed examples.

        reference_id:
          anyOf:
            - description: "Single speaker: voice model ID string"
              type: string
            - description: "Multiple speakers: array of voice model IDs, one per speaker"
              type: array
              items:
                type: string
            - type: "null"
          default: null
          description: |
            Voice model ID from Fish Audio or your custom models. Use a string
            for single-speaker synthesis, or an array of model IDs for
            multi-speaker dialogue on `s2-pro` or an S2.1-Pro model. When using multiple speakers,
            add speaker tags in `text`. See the HTTP Text to Speech API page
            for full examples.

        prosody:
          oneOf:
            - $ref: "#/components/schemas/WebSocketProsodyControl"
            - type: "null"
          default: null
          description: Speed and volume adjustments for the output.

        chunk_length:
          type: integer
          minimum: 100
          maximum: 300
          default: 300
          description: |
            Text segment size for processing.

        condition_on_previous_chunks:
          type: boolean
          default: true
          description: |
            Use previous audio as context for voice consistency.

        normalize:
          type: boolean
          default: true
          description: |
            Normalizes text for English and Chinese, improving stability for
            numbers.

        early_stop_threshold:
          type: number
          minimum: 0.0
          maximum: 1.0
          default: 1.0
          description: |
            Early stopping threshold for batch processing.

        format:
          type: string
          enum:
            - wav
            - pcm
            - mp3
            - opus
          default: mp3
          description: Output audio format.

        sample_rate:
          type: [integer, "null"]
          default: null
          description: |
            Audio sample rate in Hz. When null, uses the format's default
            (44100 Hz for most formats, 48000 Hz for opus).

        mp3_bitrate:
          type: integer
          enum:
            - 64
            - 128
            - 192
          default: 128
          description: |
            MP3 bitrate in kbps. Only applies when format is mp3.

        opus_bitrate:
          type: integer
          enum:
            - -1000
            - 24000
            - 32000
            - 48000
            - 64000
          default: -1000
          description: |
            Opus bitrate in bps. -1000 for automatic. Only applies when format
            is opus.

        latency:
          type: string
          enum:
            - low
            - normal
            - balanced
          default: normal
          description: |
            Latency-quality trade-off. normal: best quality, balanced: reduced
            latency, low: lowest latency.

    WebSocketReferenceAudio:
      type: object
      required:
        - audio
        - text
      properties:
        audio:
          type: string
          format: binary
          description: Audio file bytes for the reference sample
        text:
          type: string
          description: |
            Transcription of what is spoken in the reference audio. Should match
            exactly what's spoken and include punctuation for proper prosody.

    WebSocketProsodyControl:
      type: object
      properties:
        speed:
          type: number
          minimum: 0.5
          maximum: 2.0
          default: 1.0
          description: |
            Speaking rate multiplier. Valid range: 0.5 to 2.0. 1.0 = normal
            speed, 0.5 = half speed, 2.0 = double speed. Useful for adjusting
            pacing without regenerating audio.
        volume:
          type: number
          minimum: -20.0
          maximum: 20.0
          default: 0.0
          description: |
            Volume adjustment in decibels (dB). 0 = no change, positive values
            = louder, negative values = quieter.
        normalize_loudness:
          type: boolean
          default: true
          description: |
            Normalize output loudness for more consistent perceived volume.
            Supported on `s2-pro` and the S2.1-Pro family.

    AsrAudioFormat:
      type: object
      required:
        - format
        - sample_rate
        - channels
      properties:
        format:
          type: string
          const: pcm_s16le
          description: 16-bit little-endian PCM.
        sample_rate:
          type: integer
          enum:
            - 8000
            - 12000
            - 16000
            - 22050
            - 24000
            - 32000
            - 44100
            - 48000
          description: Sample rate in Hz. Rates other than 16000 are converted on the server; you never need to resample.
        channels:
          type: integer
          const: 1
          description: Mono only.

    AsrTurnDetection:
      type: object
      properties:
        mode:
          type: string
          enum:
            - auto
            - vad
            - manual
          default: auto
          description: |
            auto: the server's turn detection decides when the user has
            finished, and tells user turns from noise and other voices.
            vad: a turn ends after `silence_timeout_ms` of silence.
            manual: a turn ends when you send `finalize`.
        eager:
          type: boolean
          default: false
          description: Send `eager_end_of_turn` in auto mode.
        silence_timeout_ms:
          type: integer
          description: |
            auto: default 5000, allowed 3000–60000 (a safety net for user
            turns). vad: default 700, allowed 300–60000 (the silence that
            ends a turn). manual: default 60000, allowed 300–60000 (a safety
            net). Checked against the mode it will run under.

    AsrResults:
      type: object
      properties:
        drafts:
          type: boolean
          default: false
          description: Send live `draft` messages.
        draft_interval_ms:
          type: integer
          minimum: 250
          default: 250
          description: Minimum time between drafts. Smaller values count as 250.
        ignore_timestamps:
          type: boolean
          default: true
          description: "`false` adds `words` with timings to `committed`."
        diarize:
          oneOf:
            - type: boolean
            - type: string
              enum:
                - auto
          default: true
          description: Speaker tags in the text. `auto` is the same as `true`; `false` removes them.
        vad_events:
          type: boolean
          default: false
          description: Send `vad` messages.
        eot_events:
          type: boolean
          default: false
          description: Send `eot_prob` messages.

    AsrContext:
      type: object
      properties:
        history:
          type: array
          maxItems: 32
          items:
            $ref: "#/components/schemas/AsrContextItem"
          description: Earlier conversation, oldest first.
        terms:
          type: array
          maxItems: 100
          items:
            type: string
            maxLength: 32
          description: Names, products and jargon to recognize.

    AsrContextItem:
      type: object
      required:
        - role
        - text
      properties:
        role:
          type: string
          enum:
            - user
            - assistant
        text:
          type: string
          maxLength: 2000

    AsrWord:
      type: object
      required:
        - text
        - start_ms
        - end_ms
      properties:
        text:
          type: string
        start_ms:
          type: integer
        end_ms:
          type: integer

    AsrLimits:
      type: object
      properties:
        max_session_ms:
          type: integer
          description: Maximum session length (3600000).
        max_turn_ms:
          type: integer
          description: Maximum turn length (60000).
        max_frame_bytes:
          type: integer
          description: Maximum message size (1048576).

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        API key authentication using Bearer token.

        Get your API key from https://fish.audio/app/api-keys

        Pass the token in the Authorization header:
        `Authorization: Bearer YOUR_API_KEY`
